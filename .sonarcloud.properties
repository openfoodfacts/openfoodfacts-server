sonar.sources=cgi,docker,lib,scripts,templates,scss,html/css,html/js,docker-compose.yml,Dockerfile,Dockerfile.frontend,gulpfile.mjs,Makefile
sonar.tests=tests

sonar.exclusions=scripts/obsolete/**/*,html/css/normalize.css,scripts/taxonomies/generators/**/*
sonar.test.exclusions=tests/unit/expected_test_results/**/*,tests/integration/expected_test_results/**/*

# *.tt.json files are Template Toolkit templates that generate JSON, not JSON themselves,
# so the JSON parser (json:S2260) reports false-positive parsing errors on TT directives
#
# scripts/imports/** are operator-invoked import scripts, not web-facing code.
# The taint source assumed by pythonsecurity:S8707 ("Path Traversal via faulty
# LLM-supplied CLI arguments") is an untrusted user/LLM crafting CLI args; here the
# args come from the operator running the script manually, so these are false positives.
# The same applies to scripts/run_ocr.py: a batch OCR job whose CLI args (--seen-path,
# --base-image-dir) are supplied by the operator, not by remote users.
sonar.issue.ignore.multicriteria=tt_json_templates,llm_path_traversal_import_scripts,llm_path_traversal_run_ocr

sonar.issue.ignore.multicriteria.tt_json_templates.ruleKey=json:S2260
sonar.issue.ignore.multicriteria.tt_json_templates.resourceKey=**/*.tt.json

sonar.issue.ignore.multicriteria.llm_path_traversal_import_scripts.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.llm_path_traversal_import_scripts.resourceKey=scripts/imports/**/*

sonar.issue.ignore.multicriteria.llm_path_traversal_run_ocr.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.llm_path_traversal_run_ocr.resourceKey=scripts/run_ocr.py
