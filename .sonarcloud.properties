sonar.sources=cgi,docker,lib,scripts,templates,scss,html/css,html/js,docker-compose.yml,Dockerfile,Dockerfile.frontend,gulpfile.mjs,Makefile
sonar.tests=tests

sonar.exclusions=scripts/obsolete/**/*,html/css/normalize.css,scripts/taxonomies/generators/**/*
sonar.test.exclusions=tests/unit/expected_test_results/**/*,tests/integration/expected_test_results/**/*

# *.tt.json files are Template Toolkit templates that generate JSON, not JSON themselves,
# so the JSON parser (json:S2260) reports false-positive parsing errors on TT directives
sonar.issue.ignore.multicriteria=tt_json_templates
sonar.issue.ignore.multicriteria.tt_json_templates.ruleKey=json:S2260
sonar.issue.ignore.multicriteria.tt_json_templates.resourceKey=**/*.tt.json
