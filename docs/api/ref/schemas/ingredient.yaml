type: object
title: ingredient
properties:
  id:
    type: string
  equivalents:
    type: array
    description: |
      Declared equivalents of this ingredient, such as fresh carrot equivalent
      for dried carrots. These annotations are not additional ingredients and
      their percentages are not used as actual ingredient percentages.
    items:
      type: object
      required: [id, text, percent]
      properties:
        id:
          type: string
        text:
          type: string
        percent:
          type: number
  ingredients:
    type: array
    description: |
      This structure gives the different ingredients and some information about them,
      like estimate on their quantity.
    items:
      $ref: "./ingredient.yaml"
  percent:
    type: integer
    description: The percentage of the ingredient.
  percent_estimate:
    type: number
    description: Estimated percentage of the ingredient.
  percent_max:
    type:
      - "string"
      - "number"
    description: Maximum percentage of the ingredient.
  percent_min:
    type: integer
    description: Minimum percentage of the ingredient.
  text:
    type: string
    description: Text description of the ingredient.
  vegan:
    type: string
    description: Indicates if the ingredient is vegan.
  vegetarian:
    type: string
    description: Indicates if the ingredient is vegetarian.
