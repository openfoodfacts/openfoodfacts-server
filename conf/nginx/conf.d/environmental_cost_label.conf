# njs module rendering the French "coût environnemental" (Ecobalyse) label as SVG
# see conf/nginx/njs/README.md
# Needs the njs module to be loaded (load_module modules/ngx_http_js_module.so;)
# with the QuickJS engine (njs >= 0.8.6 built with QuickJS, e.g. the nginx.org nginx-module-njs package):
# the built-in njs engine is deprecated since njs 1.0.0
js_engine qjs;
js_path /etc/nginx/njs/;
js_import environmental_cost_label from environmental_cost_label.js;
