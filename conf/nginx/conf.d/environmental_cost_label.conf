# njs module rendering the French "coût environnemental" (Ecobalyse) label as SVG
# see conf/nginx/njs/README.md
# Needs the njs module to be loaded (Debian: libnginx-mod-http-js package,
# nginx.org packages: nginx-module-njs and load_module modules/ngx_http_js_module.so;)
# Uses the default njs engine: QuickJS (js_engine qjs) is not available in the Debian package,
# and the code runs unchanged on both engines.
js_path /etc/nginx/njs/;
js_import environmental_cost_label from environmental_cost_label.js;
