<off-webcomponents-configuration
  language-code="[% language_code | html %]"
  country-code="[% country_code | html %]"
  robotoff-configuration='{
    "apiUrl": [% (robotoff_domain _ '/api/v1') | js %],
    "imgUrl": [% (images_domain _ '/images/products') | js %]
  }'
  [% IF (folksonomy_uri.defined) && (folksonomy_uri.length> 0) %]
  folksonomy-configuration='{
  "apiUrl": [% folksonomy_uri | js %]
  }'
  [% END %]
  openfoodfacts-api-url="[% api_domain | html %]"
  assets-images-path="[% static_subdomain | html %]/css/dist/images"
  ></off-webcomponents-configuration>
