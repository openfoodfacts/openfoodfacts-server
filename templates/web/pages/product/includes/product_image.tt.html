<!-- start templates/[% component.name %] -->

<figure itemscope itemtype="https://schema.org/ImageObject">
    <img src="[% display_image_url | html %]" width="[% display_size_width | html %]" height="[% display_size_height | html %]" alt="[% alt | html %]" itemprop="thumbnail" loading="lazy">
	<figcaption>
		<p><a href="[% full_image_url | html %]" itemprop="contentUrl">[% full_size | html %]</a></p>
		<p>[% creativecommons %][% original_link %]</p>
		<p>[% attribution %]</p>
	</figcaption>
	<a class="button small action-report_product_to_nutripatrol" href="[% nutripatrol_url | html %]/flag/image/?barcode=[% code | uri %]&amp;image_id=[% original_id | uri %]&amp;source=web&amp;flavor=[% flavor | uri %]">
		[% lang('action_report_image_to_nutripatrol') %]
	</a>
</figure>

<!-- end templates/[% component.name %] -->
