# Some tweaks to be able to run npm run lint
services:
  dynamicfront:
    command: ["npm", "run", "lint"]
    volumes:
      # linting conf
      - ./eslint.config.mjs:/opt/product-opener/eslint.config.mjs
      - ./.prettierrc:/opt/product-opener/.prettierrc
      - ./.prettierignore:/opt/product-opener/.prettierignore
      # extra files to lint
      - ./scripts:/opt/product-opener/scripts
      - ./tests:/opt/product-opener/tests
