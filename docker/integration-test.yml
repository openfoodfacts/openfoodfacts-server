include:
  - ${DEPS_DIR}/openfoodfacts-shared-services/docker-compose.yml

services:
  frontend:
    depends_on:
        backend:
          condition: service_started

  # The tests only need the built assets in the *_dist volumes (the backend inlines the svg icons).
  # dynamicfront starts before the backend and mounts the empty volumes first, so Docker copies the
  # assets of the frontend image (built from the same Dockerfile.frontend) into them: no need to build
  # the dynamicfront image and run gulp in each test run. "true" ignores the npm command and exits.
  dynamicfront:
    image: openfoodfacts-server/frontend:dev
    build: !reset null
    entrypoint: ["true"]

  keycloak:
    image: ghcr.io/openfoodfacts/openfoodfacts-auth:testcontainer
    environment:
      - KC_SPI_EVENTS_LISTENER_REDIS_EVENT_LISTENER_REDIS_URL=${REDIS_URL}
      - KC_LOG_LEVEL=info

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      dynamicfront:
        condition: service_started
      incron:
        condition: service_started
      minion:
        condition: service_started
      redis:
        condition: service_started
      redis-listener:
        condition: service_started
      keycloak:
        # Keycloak takes a while to start so need to wait until it is healthy
        condition: service_healthy
