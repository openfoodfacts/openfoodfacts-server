# Tags rules for chocolates. See docs/dev/explain-tags-rules.md for the format.
#
# The cocoa content cannot be computed from the ingredients (cocoa butter and cocoa powder add up to the
# cocoa paste). The rules use the cocoa nutrient ("cocoa: 55% minimum", entered in the nutrition facts)
# or the cocoa content stated in the ingredients list ("Cacao : 55% minimum"), parsed by the ingredients
# parser in specific_ingredients.

- id: dark-chocolates-semi-sweet
  description: Dark chocolates with less than 65% cocoa (FoodEx2 A034H Bitter-sweet chocolate)
  if:
    categories: en:dark-chocolates
    any:
      - nutrients:
          cocoa: {min: 30, max: 64.9}
      - all:
          - specific_ingredients:
              en:cocoa: {min: 30, max: 64.9}
          - not:
              nutrients:
                cocoa: {min: 65}
  unless:
    - nutrients:
        cocoa: {min: 65}
    # Another cocoa content of 65% or more (e.g. a dark chocolate and a milk chocolate in the same product)
    - specific_ingredients:
        en:cocoa: {min: 65}
    # 65% or more in the name (e.g. "Chocolat noir 72%"): the data contradicts the name
    - name:
        any: '\b(6[5-9]|[7-9]\d|100)\s*%'
    - categories: [en:milk-chocolates, en:plant-milk-chocolates, en:filled-chocolates, en:bonbons, en:spreads]
    # Milk powder: a dark milk chocolate rather than a dark chocolate
    - ingredients:
        contains: en:milk-powder
    - name:
        categories: [en:milk-chocolates, en:white-chocolates]
        languages: any
  add:
    categories: en:semi-sweet-dark-chocolates
  tests:
    match:
      - categories: [en:dark-chocolates]
        specific_ingredients: [{id: en:cocoa, percent: 55}]
      - categories: [en:dark-chocolates]
        nutrients: {cocoa: 52}
      - categories: [en:dark-chocolates]
        specific_ingredients: [{id: en:cocoa, percent: 64.5}]
    no_match:
      - categories: [en:dark-chocolates]
        specific_ingredients: [{id: en:cocoa, percent: 70}]
      - categories: [en:dark-chocolates]
        nutrients: {cocoa: 72}
      - categories: [en:dark-chocolates]
        specific_ingredients: [{id: en:cocoa, percent: 55}]
        nutrients: {cocoa: 70}
      - categories: [en:dark-chocolates]
        product_name_fr: Chocolat noir 55%
      - categories: [en:dark-chocolates]
        nutrients: {cocoa: 50}
        product_name_fr: Chocolat noir 72% de cacao
      # Dark and milk chocolates in the same product
      - categories: [en:dark-chocolates]
        specific_ingredients: [{id: en:cocoa, percent: 70}, {id: en:cocoa, percent: 35}]
      - categories: [en:dark-chocolates]
        specific_ingredients: [{id: en:cocoa, percent: 46}]
        ingredients: [en:sugar, en:cocoa-paste, en:skimmed-milk-powder, en:cocoa-butter]
      - categories: [en:dark-chocolates]
        specific_ingredients: [{id: en:cocoa, percent: 40}]
        product_name_fr: Chocolat noir et chocolat au lait
      - categories: [en:dark-chocolates, en:cocoa-and-hazelnuts-spreads]
        nutrients: {cocoa: 60}
