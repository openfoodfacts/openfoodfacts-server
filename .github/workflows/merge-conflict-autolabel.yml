name: '💥 Auto-Label Merge Conflicts on PRs'
on:
  push:
    branches:
      - main
  pull_request_target:
    types: [synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3.1.0
        continue-on-error: true  # Don’t mark PRs as failing because this errs
        with:
          dirtyLabel: "💥 Merge Conflicts"
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          retryMax: 5
          # retryAfter is in seconds (the old mschilde action used WAIT_MS in ms)
          retryAfter: 5
