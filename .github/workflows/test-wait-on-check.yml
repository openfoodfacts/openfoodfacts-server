name: 🧪 Test wait-on-check-action (temporary, remove before merge)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test against (should have completed build checks)'
        required: true
        default: '57359cce88'
jobs:
  test-wait:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for frontend container build workflow
        id: wait-build
        uses: lewagon/wait-on-check-action@v1.9.1
        timeout-minutes: 20
        with:
          ref: ${{ github.event.inputs.sha }}
          check-name: build (frontend)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          checks-discovery-timeout: 300
          allowed-conclusions: success

      - name: Wait for backend container build workflow
        id: wait-build2
        uses: lewagon/wait-on-check-action@v1.9.1
        timeout-minutes: 20
        with:
          ref: ${{ github.event.inputs.sha }}
          check-name: build (backend)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          checks-discovery-timeout: 300
          allowed-conclusions: success

      - name: Confirm success
        run: echo "Both checks found and passed for ${{ github.event.inputs.sha }}"
