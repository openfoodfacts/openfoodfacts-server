name: Test Groups Management

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A single trusted writer publishes versioned snapshots on the default branch.
concurrency:
  group: test-timing-snapshot
  cancel-in-progress: false

jobs:
  analyze_and_optimize:
    name: Collect timings and publish test balancing snapshot
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 1

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .test_timing_history/v2
        key: test-timings-v2-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: test-timings-v2-snapshot-

    # PR runs, including forks, publish per-shard artifacts. This trusted script
    # reads XML as data; it never checks out or executes code from a PR.
    - name: Merge recent successful PR timings
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/collect_test_timings.py

    - name: Generate performance report for both coverage profiles
      run: |
        {
          echo '# Test Groups Performance Report'
          date -u '+Generated on: %Y-%m-%d %H:%M UTC'
          for profile in coverage no-coverage; do
            for test_type in unit integration; do
              echo
              echo "## $profile / $test_type"
              echo '```'
              python3 scripts/dynamic_test_grouper.py --type="$test_type" --profile="$profile" \
                | sed -n '/^# Auto-calculated/p;/^# Group Statistics/,$p'
              echo '```'
            done
          done
        } > "$RUNNER_TEMP/test_groups_report.md"
        cat "$RUNNER_TEMP/test_groups_report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Save a new default-branch snapshot
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .test_timing_history/v2
        key: test-timings-v2-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload performance report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-groups-performance-report
        path: ${{ runner.temp }}/test_groups_report.md
        retention-days: 30
